<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Tip Calculator | Calculate Tips & Split Bills Instantly</title>
    <meta name="description" content="Calculate tips and split bills instantly. Free online tip calculator with customizable tip percentages.">
    <meta name="keywords" content="tip calculator, bill splitter, gratuity calculator, split bill">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Tip Calculator | Calculate Tips & Split Bills Instantly">
    <meta property="og:description" content="Calculate tips and split bills instantly with customizable percentages.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tip-calculator.vercel.app/">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tip Calculator">
    <meta name="twitter:description" content="Calculate tips and split bills instantly.">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://tip-calculator.vercel.app/">
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #3b82f6;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .calculator-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            display: flex;
            gap: 0.5rem;
        }

        .input-wrapper input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.125rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .currency-badge {
            display: flex;
            align-items: center;
            padding: 0 1rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tip-btn {
            padding: 0.75rem;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .tip-btn:hover {
            background: var(--bg-primary);
        }

        .tip-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .custom-tip-wrapper {
            display: flex;
            gap: 0.5rem;
        }

        .custom-tip-wrapper input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .result-item {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .result-per-person {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .reset-btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1.5rem;
        }

        .reset-btn:hover {
            background: var(--border);
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.5rem;
            }
            .result-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Tip Calculator</h1>
            <p class="subtitle">Calculate tips & split bills instantly</p>
        </header>

        <main>
            <div class="calculator-container">
                <div class="input-group">
                    <label class="input-label" for="bill-amount">Bill Amount</label>
                    <div class="input-wrapper">
                        <input type="number" id="bill-amount" placeholder="Enter bill amount" step="0.01" min="0">
                        <span class="currency-badge">$</span>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="people-count">Number of People</label>
                    <div class="input-wrapper">
                        <input type="number" id="people-count" placeholder="1" value="1" min="1" step="1">
                        <span class="currency-badge">👥</span>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Tip Percentage</label>
                    <div class="tip-buttons">
                        <button class="tip-btn" data-percent="5">5%</button>
                        <button class="tip-btn active" data-percent="10">10%</button>
                        <button class="tip-btn" data-percent="15">15%</button>
                        <button class="tip-btn" data-percent="18">18%</button>
                        <button class="tip-btn" data-percent="20">20%</button>
                        <button class="tip-btn" data-percent="25">25%</button>
                    </div>
                    <div class="custom-tip-wrapper">
                        <input type="number" id="custom-tip" placeholder="Custom % (optional)" step="0.1" min="0" max="100">
                    </div>
                </div>

                <div class="results-container">
                    <div class="result-item">
                        <div class="result-label">Tip Amount</div>
                        <div class="result-value" id="tip-amount">$0.00</div>
                        <div class="result-per-person" id="tip-per-person">$0.00 / person</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Total</div>
                        <div class="result-value" id="total-amount">$0.00</div>
                        <div class="result-per-person" id="total-per-person">$0.00 / person</div>
                    </div>
                </div>

                <button class="reset-btn" id="reset-btn">Reset</button>
            </div>
        </main>
    </div>

    <footer>
        <p>Instant calculation • Custom tips • No registration required</p>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
